name: Portfolio email

on:
  schedule:
    # 09:15 svensk tid på vardagar
    # Vintertid: 08:15 UTC
    - cron: "15 8 * * 1-5"
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run portfolio script
        env:
          # SMTP-inställningar (mappade från dina befintliga GMAIL-secrets)
          SMTP_HOST: smtp.gmail.com
          SMTP_PORT: "587"
          SMTP_USER: ${{ secrets.GMAIL_FROM }}
          SMTP_PASS: ${{ secrets.GMAIL_APP_PASSWORD }}

          # Mail-adresser
          EMAIL_FROM: ${{ secrets.GMAIL_FROM }}
          EMAIL_TO: ${{ secrets.GMAIL_TO }}

          # Valfritt
          SUBJECT_PREFIX: Portfolio
          BASE_CCY: SEK

        run: |
          python portfolio_cloud.py
